services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: photo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - photo-network
  
  backend:
    build: ./backend
    container_name: photo_backend
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - photo-network


networks:
  photo-network:
    driver: bridge

volumes:
  postgres_data: