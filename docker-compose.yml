services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: prismato_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - photo-network

  backend:
    build: ./backend
    container_name: prismato_backend
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - photo-network

  frontend:
    build: ./frontend
    container_name: prismato_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - PUBLIC_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    networks:
      - photo-network
    depends_on:
      - backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - photo-network

  celery_worker:
    build: ./backend
    command: celery -A core.celery_app worker --loglevel=info
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
    networks:
      - photo-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

networks:
  photo-network:
    driver: bridge

volumes:
  postgres_data:
